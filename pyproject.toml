[project]
name = "dv-entity-linking"
version = "0.0.0"
description = "DV entity linking demo for Ops Copilot and Fault Agent entity workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.1.1",
]

[project.optional-dependencies]
web = [
    "Flask>=3,<4",
]
performance-mock = [
    "Flask>=3,<4",
    "PyMySQL>=1.1,<2",
    "pyahocorasick>=2.1,<3",
    "waitress>=3,<4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
